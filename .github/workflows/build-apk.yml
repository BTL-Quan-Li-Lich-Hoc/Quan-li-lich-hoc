name: Verify and build Android APK

on:
  push:
    branches:
      - main
      - test/cooc1-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Prepare Android and dependencies
        run: bash tool/bootstrap.sh
      - name: Static analysis and automated tests
        run: bash tool/quality.sh
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: better-phenikaa-schedule-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

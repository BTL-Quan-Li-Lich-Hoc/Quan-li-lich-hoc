name: Cooc 1.0 Test APK
on:
  push:
    branches:
      - test/cooc1-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout integrated code
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Flutter and Dart versions
        run: flutter --version
      - name: Prepare Android / dependencies
        run: bash tool/bootstrap.sh
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cooc-1.0-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Cooc-1.0-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

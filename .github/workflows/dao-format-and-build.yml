name: Dao branch formatting and Android build

on:
  push:
    branches:
      - feature/widget-settings-dao
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap
        run: bash tool/bootstrap.sh
      - name: Apply Dart analyzer fixes
        run: dart fix --apply
      - name: Apply Dart formatter
        run: dart format lib test
      - name: Commit source fixes only if necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test
          if ! git diff --cached --quiet; then
            git commit -m "Sửa định dạng và cảnh báo Dart"
            git push origin HEAD:feature/widget-settings-dao
          fi
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dao-branch-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

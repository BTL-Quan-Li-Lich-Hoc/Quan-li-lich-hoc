name: Integration branch validation

on:
  push:
    branches:
      - 'test/integration-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap
        run: bash tool/bootstrap.sh
      - name: Normalize formatting for diagnostic tests
        run: dart format lib test
      - name: Analyze integrated source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Unit and integration pipeline tests
        run: flutter test --reporter expanded
      - name: Build debug APK
        id: debug_build
        run: flutter build apk --debug
        continue-on-error: true
      - name: Build release APK
        id: release_build
        run: flutter build apk --release
        continue-on-error: true
      - name: Fail CI on any APK build failure
        if: always()
        run: |
          test "${{ steps.debug_build.outcome }}" = success
          test "${{ steps.release_build.outcome }}" = success
